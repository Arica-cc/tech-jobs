const T2S = {"測": "测", "試": "试", "師": "师", "後": "后", "資": "资", "設": "设", "計": "计", "開": "开", "發": "发", "數": "数", "據": "据", "營": "营", "運": "运", "產": "产", "經": "经", "專": "专", "員": "员", "網": "网", "絡": "络", "務": "务", "職": "职", "責": "责", "銷": "销", "廣": "广", "業": "业", "線": "线", "體": "体", "驗": "验", "環": "环", "遠": "远", "處": "处", "戶": "户", "帳": "账", "號": "号", "碼": "码", "語": "语", "華": "华", "貿": "贸", "會": "会", "財": "财", "稅": "税", "證": "证", "簽": "签", "護": "护", "執": "执", "層": "层", "級": "级", "總": "总", "監": "监", "長": "长", "組": "组", "團": "团", "隊": "队", "領": "领", "導": "导", "協": "协", "調": "调", "溝": "沟", "優": "优", "勢": "势", "獎": "奖", "勵": "励", "績": "绩", "準": "准", "備": "备", "讀": "读", "寫": "写", "說": "说", "聽": "听", "譯": "译", "書": "书", "學": "学", "歷": "历", "項": "项", "創": "创", "製": "制", "視": "视", "頻": "频", "劇": "剧", "畫": "画", "圖": "图", "檔": "档", "類": "类", "統": "统", "構": "构", "雲": "云", "庫": "库", "儲": "储", "緩": "缓", "機": "机", "習": "习", "規": "规", "劃": "划", "質": "质", "檢": "检", "異": "异", "風": "风", "險": "险", "審": "审", "賬": "账", "單": "单", "實": "实", "時": "时", "報": "报", "價": "价", "錢": "钱", "輔": "辅", "訓": "训", "練": "练", "錄": "录", "聯": "联", "繫": "系", "飛": "飞", "鏈": "链", "區": "区", "塊": "块", "遊": "游", "戲": "戏", "電": "电", "競": "竞", "東": "东", "亞": "亚", "灣": "湾", "臺": "台", "馬": "马", "來": "来", "種": "种", "選": "选", "擇": "择", "維": "维", "個": "个", "為": "为", "與": "与", "動": "动", "態": "态", "點": "点", "擊": "击", "轉": "转", "換": "换", "傳": "传", "輸": "输", "樣": "样", "標": "标", "題": "题", "際": "际", "國": "国", "內": "内", "雙": "双", "週": "周", "這": "这", "們": "们", "對": "对", "應": "应", "該": "该", "還": "还", "進": "进", "過": "过", "適": "适", "當": "当", "關": "关", "鍵": "键", "詞": "词", "顧": "顾", "問": "问", "須": "须", "樓": "楼", "場": "场", "賽": "赛", "盤": "盘", "擬": "拟", "狀": "状", "況": "况", "嚴": "严", "謹": "谨", "認": "认", "識": "识", "鬆": "松", "穩": "稳", "複": "复", "雜": "杂", "響": "响", "頁": "页", "嗎": "吗", "麼": "么", "於": "于", "從": "从", "並": "并", "將": "将", "結": "结", "閱": "阅", "夠": "够", "舉": "举", "辦": "办", "濟": "济", "圍": "围", "傷": "伤", "願": "愿", "給": "给", "紀": "纪", "約": "约", "縮": "缩", "細": "细", "範": "范", "織": "织", "揮": "挥", "頭": "头", "顯": "显", "屬": "属", "額": "额", "隨": "随", "變": "变", "讓": "让", "議": "议", "論": "论", "談": "谈", "請": "请", "誠": "诚", "謝": "谢", "豐": "丰", "負": "负", "費": "费", "貼": "贴", "賺": "赚", "購": "购", "貨": "货", "帶": "带", "幫": "帮", "廳": "厅", "歡": "欢", "獨": "独", "現": "现", "瓏": "珑", "闆": "板", "陸": "陆", "雖": "虽", "難": "难", "靜": "静", "順": "顺", "預": "预", "頓": "顿", "飯": "饭", "魚": "鱼", "鳥": "鸟", "黃": "黄"};
function norm(s){ return (s||"").toLowerCase().replace(/[\u4e00-\u9fff]/g, ch => T2S[ch] || ch); }
// 搜索不分繁简体:关键字和岗位内容都先转成简体再比对
function currentQuery(){ return norm((document.getElementById('searchInput').value || '').trim()); }
function matchesQuery(j, q){ return !q || norm(j.title).includes(q) || norm(j.jd).includes(q); }

const chipRow = document.getElementById('chipRow');
function renderChips(){
  // 有关键字时,分类后面的数字显示「这个分类里有几个符合的岗位」
  const q = currentQuery();
  const counts = {};
  let total = 0;
  JOBS.forEach(j => { if (matchesQuery(j, q)) { counts[j.cat] = (counts[j.cat]||0) + 1; total++; } });
  const chips = [{cat:null,label:'全部',n:total}].concat(
    CATS.filter(c => catCounts[c]).map(c => ({cat:c,label:c,n:counts[c]||0}))
  );
  chipRow.innerHTML = chips.map(c => `
    <div class="chip ${activeCat===c.cat ? 'active':''}" data-cat="${c.cat ?? ''}">
      ${c.label} <span class="n">${c.n}</span>
    </div>
  `).join('');
  chipRow.querySelectorAll('.chip').forEach(el => {
    el.addEventListener('click', () => {
      const v = el.getAttribute('data-cat');
      activeCat = v === '' ? null : v;
      renderChips();
      render();
    });
  });
}

function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function escapeRegex(s){
  return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}
function highlight(rawText, q){
  // 在转成简体后的文字里找关键字位置,再把原文对应的字标亮(繁体原文也能标亮)
  rawText = rawText || '';
  if (!q) return escapeHtml(rawText);
  const n = norm(rawText);
  if (n.length !== rawText.length) return escapeHtml(rawText);
  let out = '', i = 0, k;
  while ((k = n.indexOf(q, i)) !== -1){
    out += escapeHtml(rawText.slice(i, k)) + '<mark>' + escapeHtml(rawText.slice(k, k + q.length)) + '</mark>';
    i = k + q.length;
  }
  return out + escapeHtml(rawText.slice(i));
}

const list = document.getElementById('list');
const empty = document.getElementById('empty');
const statsEl = document.getElementById('stats');

function render(){
  const q = currentQuery();

  let filtered = JOBS.filter(j => {
    if (activeCat && j.cat !== activeCat) return false;
    return matchesQuery(j, q);
  });

  // 有关键字时:标题命中的排在前面(最相关),仅描述里命中的排后面,
  // 且给后者打上"命中于描述"的提示,避免看起来像误匹配。
  if (q){
    filtered = filtered
      .map((j, idx) => ({ j, idx, titleHit: norm(j.title).includes(q) }))
      .sort((a, b) => {
        if (a.titleHit !== b.titleHit) return a.titleHit ? -1 : 1;
        return a.idx - b.idx; // 稳定排序,组内保持原顺序
      })
      .map(x => x.j);
  }

  statsEl.textContent = `显示 ${filtered.length} / ${JOBS.length} 个职位`;

  if (filtered.length === 0){
    list.innerHTML = '';
    empty.hidden = false;
    return;
  }
  empty.hidden = true;

  const anyTitleHit = q && filtered.some(j => norm(j.title).includes(q));
  let dividerShown = false;
  list.innerHTML = filtered.map(j => {
    const titleHit = q ? norm(j.title).includes(q) : false;
    const jdOnlyHit = q && !titleHit;
    let divider = '';
    if (jdOnlyHit && !dividerShown){
      dividerShown = true;
      divider = `<div class="hit-divider">${anyTitleHit ? '以下是' : ''}岗位名称不含「${escapeHtml(q)}」、只在描述里提到的岗位</div>`;
    }
    const titleHtml = highlight(j.title, q);
    const jdHtml = highlight(j.jd, q);
    return divider + `
    <div class="card">
      <div class="card-top">
        <span class="card-tag">${escapeHtml(j.cat)}</span>
        <span class="card-id">#${escapeHtml(j.id)}</span>
      </div>
      <h3>${titleHtml}</h3>
      <div class="badge-row">
        ${j.salary ? `<span class="salary">${escapeHtml(j.salary)}</span>` : ''}
        ${j.location ? `<span class="location">📍 ${escapeHtml(j.location)}</span>` : ''}
        ${jdOnlyHit ? `<span class="card-tag jd-match">命中于描述</span>` : ''}
      </div>
      <div class="jd" id="jd-${j.id}">${jdHtml}</div>
      <div class="card-actions">
        <button class="toggle-btn" data-id="${j.id}">展开全文 ▾</button>
        <div class="right-actions">
          ${(j.notes || []).filter(k => NOTES[k]).map(k => `<button class="jp-btn" type="button" data-note="${escapeHtml(k)}">${escapeHtml(NOTES[k].btn)}</button>`).join('')}
          <button class="copy-btn" data-id="${j.id}">📋 JD复制</button>
          <a class="apply-btn" href="https://t.me/${encodeURIComponent(j.tg || 'y666899y')}" target="_blank" rel="noopener">投递 / 咨询 ↗</a>
        </div>
      </div>
    </div>
  `;
  }).join('');

  list.querySelectorAll('.toggle-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const jd = document.getElementById('jd-' + btn.getAttribute('data-id'));
      const isExpanded = jd.classList.toggle('expanded');
      btn.textContent = isExpanded ? '收起 ▴' : '展开全文 ▾';
    });
  });

  list.querySelectorAll('.jp-btn').forEach(btn => btn.addEventListener('click', () => openNote(btn.dataset.note)));

  list.querySelectorAll('.copy-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = btn.getAttribute('data-id');
      const job = JOBS.find(j => String(j.id) === String(id));
      if (!job) return;
      const parts = [job.title];
      if (job.salary) parts.push(job.salary);
      if (job.location) parts.push('📍 ' + job.location);
      parts.push('');
      parts.push(job.jd);
      const text = parts.join('\n');
      copyText(text, btn);
    });
  });
}

function copyText(text, btn){
  const showCopied = () => {
    const original = btn.dataset.label || btn.textContent;
    btn.dataset.label = original;
    btn.textContent = '✓ 已复制';
    btn.classList.add('copied');
    clearTimeout(btn._copyTimer);
    btn._copyTimer = setTimeout(() => {
      btn.textContent = original;
      btn.classList.remove('copied');
    }, 1500);
  };
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(showCopied).catch(() => fallbackCopy(text, showCopied));
  } else {
    fallbackCopy(text, showCopied);
  }
}

function fallbackCopy(text, onDone){
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.focus();
  ta.select();
  try { document.execCommand('copy'); onDone(); } catch(e) {}
  document.body.removeChild(ta);
}

document.getElementById('searchInput').addEventListener('input', () => {
  // 打关键字时自动回到「全部」,避免只在某个分类里找而漏掉
  if (currentQuery() && activeCat) activeCat = null;
  renderChips();
  render();
});

const jpModal = document.getElementById('jpModal');
function openNote(key){
  const n = NOTES[key];
  if (!n) return;
  document.getElementById('jpTitle').textContent = n.title;
  document.getElementById('jpBody').textContent = n.body.replace(/^\S*上班须知\s*/, '');
  jpModal.hidden = false;
}
function closeJapan(){
  jpModal.hidden = true;
  if (location.hash) history.replaceState(null, '', location.pathname + location.search);
}
document.getElementById('jpClose').addEventListener('click', closeJapan);
jpModal.addEventListener('click', e => { if (e.target === jpModal) closeJapan(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !jpModal.hidden) closeJapan(); });

renderChips();
render();
const hashKey = Object.keys(NOTES).find(k => '#' + NOTES[k].anchor === location.hash);
if (hashKey) openNote(hashKey);
</script>
